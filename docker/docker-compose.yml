name: bentley-app

services:
  bentley-budget-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bentley-budget-bot
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=mansa_bot
    volumes:
      # Mount data directory for persistence (optional)
      - ./data:/app/data
    networks:
      - bentley-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  bentley-network:
    external: true